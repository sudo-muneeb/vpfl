app-id: com.app.vpfl
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: vpfl
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: vpfl
    buildsystem: simple
    build-commands:
      - install -d /app/lib/vpfl
      - cp -a bundle/. /app/lib/vpfl/
      - install -D -m 755 vpfl-launcher /app/bin/vpfl
      - install -D -m 644 com.app.vpfl.desktop /app/share/applications/com.app.vpfl.desktop
      - install -D -m 644 vpfl-logo.png /app/share/icons/hicolor/512x512/apps/com.app.vpfl.png
    sources:
      - type: dir
        path: ../build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: vpfl-launcher
      - type: file
        path: com.app.vpfl.desktop
      - type: file
        path: ../vpfl-logo.png
        dest-filename: vpfl-logo.png
