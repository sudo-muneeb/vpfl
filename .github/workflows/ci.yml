name: VPFL CI

on:
  pull_request:
    branches: [bootstrap-project, main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      release:
        type: boolean
        default: false

# Only a newer commit on the same PR cancels this workflow. Reusable release
# runs use their own run ID and never cancel one another.
concurrency:
  group: ${{ github.workflow }}-vpfl-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: ci / changed files
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      core: ${{ steps.classify.outputs.core }}
      compatibility: ${{ steps.classify.outputs.compatibility }}
      packaging: ${{ steps.classify.outputs.packaging }}
      subtitles: ${{ steps.classify.outputs.subtitles }}
      desktop: ${{ steps.classify.outputs.desktop }}
      stress: ${{ steps.classify.outputs.stress }}
      workflow: ${{ steps.classify.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - name: Record exact tested commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Include both sides of renames and deletions, without pathname splitting.
            git diff --name-only -z --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            python3 scripts/ci/ci_policy.py --paths "$RUNNER_TEMP/changed-files"
          else
            test "$RELEASE" = true
            python3 scripts/ci/ci_policy.py --release
          fi
      - name: Validate CI policy and workflow configuration
        if: steps.classify.outputs.workflow == 'true' || inputs.release
        run: |
          python3 -m unittest discover -s test/ci -p 'test_ci_policy.py' -v
          for script in scripts/ci/*.sh scripts/testing/*.sh; do bash -n "$script"; done
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  commit-messages:
    name: ci / commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate new commit messages
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: python3 scripts/ci/check_commit_messages.py --range '${{ github.event.pull_request.base.sha }}..HEAD'
      - name: No commit validation outside main pull requests
        if: github.event_name != 'pull_request' || github.base_ref != 'main'
        run: echo 'Commit validation applies to pull requests targeting main.'

  fixtures:
    name: ci / fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, commit-messages]
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y ffmpeg
      - run: python3 -m unittest discover -s test/ci -p 'test_*.py' -v
      - run: python3 scripts/ci/generate_fixtures.py --out build/ci-fixtures --subtitle-suite
      - run: python3 scripts/ci/verify_fixtures.py --dir build/ci-fixtures --subtitle-suite
      - run: bash scripts/ci/generate_regression_video.sh build/ci-fixtures/regression.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-fixtures
          path: build/ci-fixtures/
          retention-days: 1
          if-no-files-found: error

  quality:
    name: ci / quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, commit-messages]
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Desktop plugin unit tests
        run: |
          flutter analyze packages/vpfl_desktop_linux
          flutter test packages/vpfl_desktop_linux/test --reporter expanded

  native:
    name: ci / native-build (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [changes, commit-messages, fixtures]
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(needs.changes.outputs.compatibility == 'true' &&
          '[{"distro":"ubuntu","image":"ubuntu:24.04","kind":"deb"},
          {"distro":"fedora","image":"fedora:44","kind":"rpm"},
          {"distro":"arch","image":"archlinux:base-devel","kind":"arch"}]' ||
          '[{"distro":"ubuntu","image":"ubuntu:24.04","kind":"deb"}]') }}
    container: ${{ matrix.image }}
    env:
      VPFL_CI_ARCH_MIRROR: https://geo.mirror.pkgbuild.com
    steps:
      - name: Prepare checkout tools
        run: |
          case '${{ matrix.distro }}' in
            ubuntu) apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y git curl tar gzip unzip xz-utils ;;
            fedora) dnf install -y git curl tar gzip unzip xz ;;
            arch)
                  # Pacman expands these placeholders when reading its mirrorlist.
                  # shellcheck disable=SC2016
                  printf 'Server = %s/$repo/os/$arch\n' "$VPFL_CI_ARCH_MIRROR" > /etc/pacman.d/mirrorlist
                  pacman -Sy --noconfirm --needed git curl tar gzip unzip xz ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - run: bash scripts/ci/install_dependencies.sh '${{ matrix.distro }}'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Trust the exact mounted Flutter SDK and checkout
        run: |
          git config --global --add safe.directory "$FLUTTER_ROOT"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$FLUTTER_ROOT" rev-parse --show-toplevel
      - uses: actions/download-artifact@v4
        with:
          name: media-fixtures
          path: build/ci-fixtures
      - run: python3 scripts/ci/verify_fixtures.py --dir build/ci-fixtures --subtitle-suite
      - run: flutter pub get --enforce-lockfile
      - name: Build native package
        if: needs.changes.outputs.packaging == 'true'
        run: |
          if [ '${{ matrix.kind }}' = arch ]; then
            bash scripts/ci/build_arch_package.sh
          else
            bash packaging/scripts/package-linux.sh '${{ matrix.kind }}'
          fi
      - name: Play video matrix under X11
        if: needs.changes.outputs.compatibility == 'true'
        run: bash scripts/ci/run_display.sh x11 flutter test integration_test/media_matrix_test.dart -d linux --dart-define=VPFL_CI_FIXTURES="$PWD/build/ci-fixtures" --reporter expanded
      - name: Native desktop bridge and external window state
        if: matrix.distro == 'ubuntu' && needs.changes.outputs.desktop == 'true'
        run: bash scripts/ci/run_desktop_regressions.sh
      - name: Existing Linux application regression tests
        if: matrix.distro == 'ubuntu'
        run: bash scripts/ci/run_regressions.sh build/ci-fixtures
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.packaging == 'true'
        with:
          name: package-${{ matrix.distro }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-logs-${{ matrix.distro }}
          path: build/ci-logs/
          retention-days: 7
          if-no-files-found: warn

  package:
    name: ci / package-install (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, commit-messages, fixtures, native]
    if: needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: ubuntu, image: 'ubuntu:24.04', pattern: '*.deb'}
          - {distro: fedora, image: 'fedora:44', pattern: '*.rpm'}
          - {distro: arch, image: 'archlinux:base-devel', pattern: '*.pkg.tar.zst'}
    container: ${{ matrix.image }}
    env:
      VPFL_CI_ARCH_MIRROR: https://geo.mirror.pkgbuild.com
    steps:
      - name: Prepare checkout tools
        run: |
          case '${{ matrix.distro }}' in
            ubuntu) apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y git curl tar gzip unzip ;;
            fedora) dnf install -y git curl tar gzip unzip ;;
            arch)
                  # Pacman expands these placeholders when reading its mirrorlist.
                  # shellcheck disable=SC2016
                  printf 'Server = %s/$repo/os/$arch\n' "$VPFL_CI_ARCH_MIRROR" > /etc/pacman.d/mirrorlist
                  pacman -Sy --noconfirm --needed git curl tar gzip unzip ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.distro }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: media-fixtures
          path: build/ci-fixtures
      - name: Install, launch, and remove target package
        run: |
          package=$(find dist -type f -name '${{ matrix.pattern }}' -print -quit)
          test -n "$package"
          bash scripts/ci/run_installed_package.sh '${{ matrix.distro }}' "$package" build/ci-fixtures/regression.mp4 build/ci-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-smoke-logs-${{ matrix.distro }}
          path: build/ci-logs/
          retention-days: 7
          if-no-files-found: warn

  display:
    name: ci / display (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, commit-messages, fixtures]
    if: needs.changes.outputs.compatibility == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [wayland, xwayland, x11-fallback]
    container: ubuntu:24.04
    steps:
      - run: apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y git curl tar gzip unzip xz-utils
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - run: bash scripts/ci/install_dependencies.sh ubuntu
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Trust the exact mounted Flutter SDK and checkout
        run: |
          git config --global --add safe.directory "$FLUTTER_ROOT"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$FLUTTER_ROOT" rev-parse --show-toplevel
      - uses: actions/download-artifact@v4
        with:
          name: media-fixtures
          path: build/ci-fixtures
      - run: python3 scripts/ci/verify_fixtures.py --dir build/ci-fixtures --subtitle-suite
      - run: flutter pub get --enforce-lockfile
      - name: Play video matrix and assert GTK backend
        run: |
          if [ '${{ matrix.mode }}' = x11-fallback ]; then
            VPFL_TEST_FAIL_GPU_INIT=1 bash scripts/ci/run_display.sh x11 flutter test integration_test/media_matrix_test.dart -d linux --dart-define=VPFL_CI_FIXTURES="$PWD/build/ci-fixtures" --reporter expanded
          else
            bash scripts/ci/run_display.sh '${{ matrix.mode }}' flutter test integration_test/media_matrix_test.dart -d linux --dart-define=VPFL_CI_FIXTURES="$PWD/build/ci-fixtures" --reporter expanded
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-logs-${{ matrix.mode }}
          path: build/ci-logs/
          retention-days: 7
          if-no-files-found: warn

  graphical_subtitles:
    name: ci / graphical-subtitles (ubuntu-x11)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 90
    needs: [changes, commit-messages, fixtures]
    if: needs.changes.outputs.subtitles == 'true'
    steps:
      - run: apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y git curl tar gzip unzip xz-utils
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - run: bash scripts/ci/install_dependencies.sh ubuntu
      - run: apt-get install -y --no-install-recommends mpv fonts-noto-core fonts-noto-cjk
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Trust the exact mounted Flutter SDK and checkout
        run: |
          git config --global --add safe.directory "$FLUTTER_ROOT"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$FLUTTER_ROOT" rev-parse --show-toplevel
      - uses: actions/download-artifact@v4
        with:
          name: media-fixtures
          path: build/ci-fixtures
      - run: python3 scripts/ci/verify_fixtures.py --dir build/ci-fixtures --subtitle-suite
      - run: flutter pub get --enforce-lockfile
      - name: Check native subtitle selection, lifecycle, picker, identity, and delay
        run: bash scripts/ci/run_subtitle_regressions.sh build/ci-fixtures
      - name: Check native mpv and media_kit subtitle frames
        run: python3 scripts/ci/run_native_subtitle_checks.py --fixtures build/ci-fixtures --out build/ci-native-subtitles
      - name: Check subtitle pixels in the VPFL X11 window
        run: |
          bash scripts/ci/run_display.sh x11 bash scripts/ci/run_subtitle_window.sh flutter test integration_test/subtitle_window_linux_test.dart -d linux --dart-define=VPFL_SUBTITLE_FIXTURES="$PWD/build/ci-fixtures" --plain-name='VPFL X11 window renders subtitle fixtures through the player UI' --reporter expanded
          bash scripts/ci/run_display.sh x11 bash scripts/ci/run_subtitle_window.sh flutter test integration_test/subtitle_window_linux_test.dart -d linux --dart-define=VPFL_SUBTITLE_FIXTURES="$PWD/build/ci-fixtures" --plain-name='Home and reopen restore visible subtitles in VPFL window' --reporter expanded
          bash scripts/ci/run_display.sh x11 bash scripts/ci/run_subtitle_window.sh flutter test integration_test/subtitle_window_linux_test.dart -d linux --dart-define=VPFL_SUBTITLE_FIXTURES="$PWD/build/ci-fixtures" --plain-name='Attached ASS stays sharp at native, resized, and fullscreen sizes' --reporter expanded
          VPFL_TEST_FAIL_GPU_INIT=1 bash scripts/ci/run_display.sh x11 bash scripts/ci/run_subtitle_window.sh flutter test integration_test/subtitle_window_linux_test.dart -d linux --dart-define=VPFL_SUBTITLE_FIXTURES="$PWD/build/ci-fixtures" --plain-name='Attached ASS stays sharp at native, resized, and fullscreen sizes' --reporter expanded
          bash scripts/ci/run_display.sh x11 bash scripts/ci/run_subtitle_window.sh flutter test integration_test/subtitle_window_linux_test.dart -d linux --dart-define=VPFL_SUBTITLE_FIXTURES="$PWD/build/ci-fixtures" --dart-define=VPFL_REFERENCE_VO=x11 --plain-name='ASS recovers after repeated Linux window resizes' --reporter expanded
          VPFL_TEST_FAIL_GPU_INIT=1 bash scripts/ci/run_display.sh x11 bash scripts/ci/run_subtitle_window.sh flutter test integration_test/subtitle_window_linux_test.dart -d linux --dart-define=VPFL_SUBTITLE_FIXTURES="$PWD/build/ci-fixtures" --dart-define=VPFL_REFERENCE_VO=x11 --plain-name='ASS recovers after repeated Linux window resizes' --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphical-subtitle-logs
          path: |
            build/ci-logs/
            build/ci-native-subtitles/
          retention-days: 7
          if-no-files-found: warn

  lifecycle_stress:
    name: ci / lifecycle-stress (30 cycles)
    needs: [changes, commit-messages, fixtures]
    if: needs.changes.outputs.stress == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - run: sudo bash scripts/ci/install_dependencies.sh ubuntu
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: media-fixtures
          path: build/ci-fixtures
      - name: Thirty Home and playback cycles
        run: bash scripts/ci/run_display.sh x11 flutter test integration_test/linux_lifecycle_test.dart -d linux --dart-define=VPFL_TEST_VIDEO="$PWD/build/ci-fixtures/regression.mp4" --dart-define=VPFL_TEST_CYCLES=30 --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-lifecycle-logs
          path: build/ci-logs/
          retention-days: 7
          if-no-files-found: warn

  required_gate:
    name: ci / required-gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [changes, commit-messages, fixtures, quality, native, package, display, graphical_subtitles, lifecycle_stress]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha || inputs.ref || github.sha }}
      - name: Require exactly the selected verification results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release || false }}
        run: python3 scripts/ci/ci_policy.py --gate
